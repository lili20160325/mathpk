<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe4f0">
<title>数学PK赛 · 和 Miuya 比一比</title>
<style>
:root{--pink:#ff6fa5;--pink2:#ffd1e3;--purple:#8e6bff;--purple2:#e6ddff;--mint:#2fbf94;--mint2:#d6f7ec;--coral:#ff8a7a;--coral2:#ffe3de;--sun:#ffc93c;--ink:#43315e;--ink2:#7a6a93;--card:#fff;--r:20px;--shadow:0 6px 18px rgba(142,107,255,.14);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;color:var(--ink);background:linear-gradient(160deg,#ffe4f0 0%,#f3eaff 45%,#e3f1ff 100%) fixed;overscroll-behavior:none;-webkit-user-select:none;user-select:none;}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.screen{display:none;min-height:100vh;min-height:100dvh;}
.screen.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px 28px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.row{display:flex;align-items:center;gap:10px}
.btn{border-radius:18px;padding:14px 18px;font-size:18px;font-weight:700;background:#fff;box-shadow:0 4px 0 rgba(67,49,94,.12);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(67,49,94,.12)}
.btn.primary{background:linear-gradient(180deg,#ff8dba,#ff5d98);color:#fff;box-shadow:0 5px 0 #d94a80}
.btn.purple{background:linear-gradient(180deg,#a68bff,#7f5cff);color:#fff;box-shadow:0 5px 0 #6243d6}
.btn.mint{background:linear-gradient(180deg,#4fd6ad,#25b488);color:#fff;box-shadow:0 5px 0 #1b8f6b}
.btn.ghost{background:rgba(255,255,255,.7)}
.iconbtn{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.85);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(67,49,94,.1)}
.iconbtn svg{width:24px;height:24px}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--purple2);color:#6a4bd8}
.tag.pink{background:var(--pink2);color:#d63e7a}.tag.mint{background:var(--mint2);color:#138a66}.tag.sun{background:#fff1c7;color:#a8740a}
h1,h2,h3{margin:0}
/* ---------- 首页 ---------- */
.home-top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#ff5d98,#8e6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--ink2);font-size:14px;margin-top:2px}
.hero{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 6px;position:relative}
.hero .av{width:108px;height:108px}
.vs{font-size:34px;font-weight:900;color:var(--sun);text-shadow:0 3px 0 #e59f00,0 0 12px #fff;transform:rotate(-8deg)}
.bubble{position:relative;background:#fff;border-radius:16px;padding:8px 12px;font-size:14px;box-shadow:var(--shadow);max-width:260px}
.hero-say{text-align:center;margin:0 auto 12px;width:fit-content}
.hero-say:after{content:"";position:absolute;right:30px;top:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
.player{display:flex;align-items:center;gap:12px}
.player .av{width:56px;height:56px;flex:none}
.pname{font-size:18px;font-weight:800;border:2px dashed transparent;border-radius:10px;padding:2px 6px;background:transparent;font-family:inherit;color:var(--ink);width:9em;outline:none}
.pname:focus{border-color:var(--pink2);background:#fff8fb}
.lvl{font-size:13px;color:var(--ink2)}
.xpbar{height:10px;border-radius:99px;background:#f1eafe;overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb3d0,#a68bff);border-radius:99px;transition:width .6s}
.sec-title{font-size:16px;font-weight:800;margin:16px 4px 8px;display:flex;align-items:center;gap:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg button{background:#fff;border-radius:18px;padding:12px 6px;box-shadow:0 4px 0 rgba(67,49,94,.08);border:3px solid transparent;min-height:72px}
.seg button b{display:block;font-size:19px}
.seg button small{display:block;color:var(--ink2);font-size:12px;margin-top:3px}
.seg button.on{border-color:var(--pink);background:#fff4f9}
.topics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.topics button{background:#fff;border-radius:16px;padding:12px 4px;font-size:15px;font-weight:700;min-height:56px;border:3px solid transparent;box-shadow:0 4px 0 rgba(67,49,94,.08)}
.topics button.on{border-color:var(--purple);background:#f7f3ff;color:#5b3fd0}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tgl{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;font-weight:700;min-height:56px;box-shadow:0 4px 0 rgba(67,49,94,.08);width:100%;font-size:15px}
.sw{width:50px;height:30px;border-radius:99px;background:#e2dcea;position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15);transition:.2s}
.tgl.on .sw{background:var(--mint)}.tgl.on .sw:after{left:23px}
.go{width:100%;font-size:24px;padding:18px;margin-top:18px;letter-spacing:4px}
.home-links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.home-links .btn{font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.home-links svg{width:22px;height:22px}
@media(min-width:900px){
  .home-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:22px;align-items:start}
  .hero .av{width:150px;height:150px}
}
/* ---------- 游戏 ---------- */
#scr-game.active{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.g-top{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;flex:none}
.g-top .qno{font-weight:900;font-size:17px}
.g-top .grow{flex:1}
.timer{font-weight:800;font-size:15px;background:#fff;border-radius:99px;padding:5px 12px;display:none;align-items:center;gap:4px}
.timer.show{display:inline-flex}.timer.low{background:var(--coral2);color:#d4513f}
.g-body{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 12px 10px;gap:8px;max-width:1240px;width:100%;margin:0 auto}
.g-left,.g-right{display:flex;flex-direction:column;gap:8px;min-height:0}
.g-left{flex:1}
.race{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:8px 10px;display:flex;flex-direction:column;gap:6px;flex:none}
.lane{display:flex;align-items:center;gap:8px}
.lane .av{width:30px;height:30px;flex:none}
.lane .nm{font-weight:800;font-size:14px;width:4.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;flex:1}
.dots i{flex:1;height:10px;border-radius:99px;background:#efe9f7;max-width:26px}
.dots i.ok{background:var(--mint)}.dots i.no{background:#ffb4a8}.dots i.cur{background:#ffe08a;box-shadow:0 0 0 2px #ffcf4a inset}
.lane .sc{font-weight:900;font-size:16px;min-width:3.2em;text-align:right}
.combo{font-size:12px;font-weight:800;color:#e0558b;background:#ffe6f0;border-radius:99px;padding:1px 7px;display:none;white-space:nowrap}
.combo.show{display:inline-block;animation:pop .3s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.miuya{background:linear-gradient(135deg,#f5f0ff,#fff);border-radius:18px;box-shadow:var(--shadow);padding:8px 10px;display:flex;align-items:center;gap:10px;flex:none;position:relative}
.miuya .av{width:48px;height:48px;flex:none;animation:bob 1.6s ease-in-out infinite}
.miuya.done .av{animation:hop .6s ease}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.m-info{flex:1;min-width:0}
.m-say{font-size:14px;font-weight:700;color:#6a4bd8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-say .dotty:after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.m-bar{height:12px;border-radius:99px;background:#ebe4fb;margin-top:6px;overflow:hidden;position:relative}
.m-bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:repeating-linear-gradient(45deg,#a68bff 0 10px,#b9a3ff 10px 20px);background-size:28px 28px;animation:stripes 1s linear infinite}
@keyframes stripes{to{background-position:28px 0}}
.miuya.done .m-bar i{background:linear-gradient(90deg,#a68bff,#ff8dba);animation:none}
.m-pen{font-size:12px;color:var(--ink2);margin-left:auto;white-space:nowrap;font-weight:700}
.scribble{position:absolute;right:12px;top:-6px;font-size:13px;font-weight:800;color:#b7a4f5;opacity:0;pointer-events:none}
.scribble.fly{animation:fly 1.6s ease-out}
@keyframes fly{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.qcard{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:14px 16px;flex:1;min-height:0;overflow:auto;position:relative}
.qtags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qtext{font-size:19px;line-height:1.65;white-space:pre-line;font-weight:500;-webkit-user-select:text;user-select:text}
.fig{display:flex;justify-content:center;margin-top:8px}
.fig svg{width:100%;max-width:300px;height:auto}
.hintbtn{margin-left:auto;background:#fff7d6;color:#a8740a;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:4px}
.hintbox{margin-top:10px;background:#fffaf0;border:2px dashed #ffd66b;border-radius:14px;padding:8px 12px;font-size:15px;display:none}
.hintbox.show{display:block;animation:fadein .2s}
.ansrow{display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:8px 12px;flex:none}
.ansrow .lab{font-weight:800;font-size:17px}
.ansbox{flex:1;min-height:46px;border-radius:14px;background:#f8f5ff;border:3px solid #ddd0ff;font-size:26px;font-weight:800;display:flex;align-items:center;padding:0 12px;letter-spacing:1px;overflow:hidden}
.ansbox .ph{color:#c2b6dc;font-size:16px;font-weight:600;letter-spacing:0}
.ansbox .caret{display:inline-block;width:3px;height:28px;background:var(--pink);margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.ansbox.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.unit{font-weight:800;font-size:17px;color:var(--ink2);white-space:nowrap}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:none}
.pad button{height:52px;border-radius:16px;background:#fff;font-size:26px;font-weight:800;box-shadow:0 4px 0 rgba(67,49,94,.12)}
.pad button:active,.pad button.press{transform:translateY(3px);box-shadow:0 1px 0 rgba(67,49,94,.12);background:#fff4f9}
.pad .fn{font-size:17px;background:#f4efff;color:#6a4bd8}
.pad .ok{grid-row:span 2;height:auto;background:linear-gradient(180deg,#ff8dba,#ff5d98);color:#fff;font-size:22px;box-shadow:0 5px 0 #d94a80}
.pad .skip{font-size:15px;background:#fff;color:var(--ink2)}
.choices{display:grid;gap:10px;flex:none}
.choices button{min-height:56px;border-radius:18px;background:#fff;font-size:19px;font-weight:800;box-shadow:0 4px 0 rgba(67,49,94,.12);border:3px solid transparent;padding:8px 12px}
.choices button.sel{border-color:var(--pink);background:#fff4f9}
.choices.two{grid-template-columns:1fr 1fr}.choices.three{grid-template-columns:1fr 1fr 1fr}
.choices-foot{display:grid;grid-template-columns:1fr 2fr;gap:10px}
@media(min-width:900px){
  .g-body{flex-direction:row;gap:16px;padding:4px 20px 16px}
  .g-right{width:390px;flex:none}
  .miuya{padding:12px 14px}.miuya .av{width:84px;height:84px}
  .m-say{font-size:16px;white-space:normal}
  .qtext{font-size:22px}
  .fig svg{max-width:380px}
  .pad button{height:62px}
  .race{padding:12px 14px}.lane .av{width:36px;height:36px}.dots i{height:12px}
}
.more-cue{display:none}
.qcard.more .more-cue{display:block;position:sticky;bottom:-14px;margin:6px -16px -14px;padding:14px 0 8px;text-align:center;font-size:13px;font-weight:800;color:#8e6bff;background:linear-gradient(rgba(255,255,255,0),#fff 55%);pointer-events:none}
.qcard.more .more-cue span{display:inline-block;background:#f3eeff;border-radius:99px;padding:3px 12px;animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(3px)}}
@media(max-width:899px){
  .qcard .fig svg{max-height:min(30vh,210px)}
  #scr-game.hasfig .pad button{height:46px}
  #scr-game.hasfig .pad .ok{height:auto}
  #scr-game.hasfig .miuya{padding:6px 10px}#scr-game.hasfig .miuya .av{width:40px;height:40px}
}
@media(max-height:700px) and (max-width:899px){.pad button{height:44px}.qtext{font-size:17px}.miuya .av{width:38px;height:38px}}
/* ---------- 反馈 ---------- */
.mask{position:fixed;inset:0;background:rgba(67,49,94,.28);display:none;z-index:20}
.mask.show{display:block;animation:fadein .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(67,49,94,.2);padding:16px 18px calc(16px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.9,.3,1.1),visibility 0s linear .28s;max-width:640px;margin:0 auto}
.sheet.show{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.9,.3,1.1)} /* 收起时隐藏，免得阴影从底边露出来、也免得键盘 Tab 到看不见的按钮 */
.fb-head{display:flex;align-items:center;gap:12px}
.fb-head .big{font-size:26px;font-weight:900}
.fb-head.ok .big{color:var(--mint)}.fb-head.no .big{color:#f07a67}
.fb-head svg{width:52px;height:52px;flex:none}
.fb-msg{color:var(--ink2);font-size:15px;margin-top:2px}
.fb-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.fb-cell{background:#faf7ff;border-radius:14px;padding:8px 10px;font-size:14px}
.fb-cell b{font-size:18px;display:block;margin-top:2px;word-break:break-all}
.pts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.pts span{font-size:13px;font-weight:800;border-radius:99px;padding:3px 10px;background:var(--mint2);color:#138a66}
.pts span.m{background:var(--purple2);color:#6a4bd8}
.steps{background:#fffaf2;border-radius:16px;padding:10px 12px 10px 12px;margin-top:6px}
.steps h4{margin:0 0 6px;font-size:15px;color:#a8740a;display:flex;align-items:center;gap:6px}
.steps ol{margin:0;padding-left:22px;font-size:15.5px;line-height:1.7}
.steps li::marker{color:#e2a31a;font-weight:800}
.fb-actions{display:flex;gap:10px;margin-top:12px}
.fb-actions .btn{flex:1}
.toggle-steps{background:none;color:#a8740a;font-weight:800;font-size:15px;padding:6px 0}
/* ---------- 结果 ---------- */
.res-banner{text-align:center;padding:10px 0 4px;position:relative}
.res-banner h2{font-size:30px;font-weight:900;margin-top:4px}
.res-banner p{color:var(--ink2);margin:6px 0 0;font-size:15px}
.trophy{width:120px;height:120px;margin:0 auto;animation:pop .6s}
.stars{display:flex;justify-content:center;gap:8px;margin:8px 0}
.stars svg{width:54px;height:54px;opacity:.25;transform:scale(.6);transition:.35s cubic-bezier(.2,.9,.3,1.4)}
.stars svg.lit{opacity:1;transform:scale(1)}
.stars svg:nth-child(2){margin-top:-12px}
.vsbox{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:10px 0}
.vsbox .side{text-align:center}
.vsbox .av{width:62px;height:62px}
.vsbox .num{font-size:30px;font-weight:900}
.vsbox .win{position:relative}
.vsbox .crown{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:34px}
.statg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.statg div{background:#faf7ff;border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;color:var(--ink2)}
.statg b{display:block;font-size:20px;color:var(--ink)}
.newbadges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0}
.res-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.res-actions .wide{grid-column:span 2}
.lvup{background:linear-gradient(90deg,#fff1c7,#ffe4f0);border-radius:14px;padding:8px 12px;text-align:center;font-weight:800;margin:8px 0;animation:pop .5s}
@media(min-width:900px){.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}}
/* ---------- 回顾 / 徽章 / 记录 ---------- */
.pagehead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pagehead h2{font-size:22px;font-weight:900;flex:1}
.rv{margin-bottom:12px}
.rv .qtext{font-size:17px}
.rv-ans{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.rv-ans span{border-radius:12px;padding:6px 10px;font-weight:800;font-size:15px}
.rv-ans .me{background:var(--coral2);color:#c9503e}.rv-ans .right{background:var(--mint2);color:#138a66}
.rv-filter{display:flex;gap:8px;margin-bottom:12px}
.rv-filter button{border-radius:99px;padding:8px 16px;font-weight:800;background:#fff;font-size:15px}
.rv-filter button.on{background:var(--purple);color:#fff}
.allgood{text-align:center;padding:24px 10px}
.allgood svg{width:110px;height:110px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:#fff;border-radius:18px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.badge svg{width:64px;height:64px}
.badge b{display:block;font-size:15px;margin-top:4px}
.badge small{display:block;color:var(--ink2);font-size:12px;margin-top:2px;line-height:1.4}
.badge.lock{opacity:.55;filter:grayscale(1)}
.mini-badge{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;width:74px;animation:pop .5s}
.mini-badge svg{width:52px;height:52px}
table.rec{width:100%;border-collapse:collapse;font-size:14px}
table.rec th{color:var(--ink2);font-weight:700;text-align:left;padding:6px 4px;border-bottom:2px solid #f1eafe}
table.rec td{padding:8px 4px;border-bottom:1px solid #f5f0fb}
.w{color:var(--mint);font-weight:800}.l{color:#e88a7a;font-weight:800}.t{color:#a8740a;font-weight:800}
.empty{color:var(--ink2);text-align:center;padding:18px}
.sumg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sumg div{background:#fff;border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;color:var(--ink2);box-shadow:var(--shadow)}
.sumg b{display:block;font-size:20px;color:var(--ink)}
/* ---------- 弹窗 / 提示 / 彩带 ---------- */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:40;background:rgba(67,49,94,.35);padding:20px}
.modal.show{display:flex;animation:fadein .2s}
.modal .card{max-width:360px;width:100%;text-align:center}
.modal p{font-size:17px;margin:10px 0 16px}
.modal .row{justify-content:center}
.modal .btn{flex:1}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-80px);background:#fff;border-radius:99px;padding:10px 18px;font-weight:800;box-shadow:var(--shadow);z-index:50;transition:transform .3s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}

<script>

(function(root){
'use strict';
/* ---------- 随机与数字工具 ---------- */
var rng=Math.random;
function setSeed(s){
  if(s==null){rng=Math.random;return;}
  var a=s>>>0;
  rng=function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
}
function ri(a,b){return a+Math.floor(rng()*(b-a+1));}
function pick(a){return a[Math.floor(rng()*a.length)];}
function chance(p){return rng()<p;}
function R(x){return Math.round(x*1e6)/1e6;}
function F(x){x=R(x);if(x===0)return '0';return String(x);}
function D(n,k){return R(n/Math.pow(10,k));}
function dp(x){var s=F(x),i=s.indexOf('.');return i<0?0:s.length-i-1;}
function isInt(x){return Math.abs(x-Math.round(x))<1e-9;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toInt(x){var p=dp(x);return [Math.round(R(x)*Math.pow(10,p)),p];}
function placeDec(n,p){var s=String(n);if(p===0)return s;while(s.length<=p)s='0'+s;return s.slice(0,s.length-p)+'.'+s.slice(s.length-p);}
function frac(a,b){var x=toInt(a),y=toInt(b);var N=x[0]*Math.pow(10,y[1]),M=y[0]*Math.pow(10,x[1]);var g=gcd(N,M);return [N/g,M/g];}
function roundHalfUp(a,b,k){var f=frac(a,b),s=Math.pow(10,k);return R(Math.floor((2*f[0]*s+f[1])/(2*f[1]))/s);}
function terminates(a,b){var M=frac(a,b)[1];while(M%2===0)M/=2;while(M%5===0)M/=5;return M===1;}
function longDiv(a,b,max){
  var f=frac(a,b),N=f[0],M=f[1],ip=Math.floor(N/M),r=N%M,digits=[],seen={},cs=-1;
  while(r!==0&&digits.length<max){if(seen[r]!==undefined){cs=seen[r];break;}seen[r]=digits.length;r*=10;digits.push(Math.floor(r/M));r%=M;}
  return {ip:ip,digits:digits,cs:cs,cl:cs<0?0:digits.length-cs};
}
function expansion(a,b,n){ // 如 3.333…（循环节是3）
  var L=longDiv(a,b,40),ds=L.digits.slice();
  if(L.cs>=0){var cyc=ds.slice(L.cs);while(ds.length<n)ds=ds.concat(cyc);}
  return {text:L.ip+'.'+ds.slice(0,n).join('')+'…',cyc:L.cs>=0?L.digits.slice(L.cs).join(''):'',digits:ds,ip:L.ip};
}
var CN=['零','一','两','三','四','五','六','七','八','九','十'];
var NAMES=['小丽','朵朵','乐乐','小明','笑笑','天天','甜甜','阳阳','小华','豆豆'];
function two(){var a=pick(NAMES),b;do{b=pick(NAMES);}while(b===a);return [a,b];}

/* ---------- 模板注册 ---------- */
var TOPICS={dm:'小数乘法',dd:'小数除法',eq:'简易方程',ar:'多边形的面积',pos:'位置',pr:'可能性',tr:'植树问题'};
var TPL=[];
function T(id,topic,lv,kind,gen){TPL.push({id:id,topic:topic,lv:lv,kind:kind,gen:gen});}

/* ======================= 小数乘法 ======================= */
T('dm_calc1','dm',[1,3],'calc',function(d){
  var a,b;
  if(d===1){a=D(ri(12,99),1);b=ri(2,9);}
  else if(d===2){a=D(ri(12,99),1);b=D(ri(2,35),1);}
  else{a=D(ri(101,999),2);b=D(ri(12,48),1);}
  if(isInt(a)||(d>1&&isInt(b)))return null;
  var x=toInt(a),y=toInt(b),prod=x[0]*y[0],p=x[1]+y[1],placed=placeDec(prod,p),ans=R(a*b);
  var steps=['先不看小数点，按整数乘法计算：'+x[0]+' × '+y[0]+' = '+prod,
    '两个因数一共有'+p+'位小数，就从积的右边起数出'+p+'位，点上小数点：'+placed];
  steps.push(placed!==F(ans)?'小数末尾的0可以去掉，所以积是 '+F(ans):'所以积是 '+F(ans));
  return {text:'计算：'+F(a)+' × '+F(b)+' = ?',expr:F(a)+'×'+F(b),answer:ans,unit:'',steps:steps,v:{a:a,b:b}};
});
T('dm_calc2','dm',[2,3],'calc',function(d){
  var k=ri(0,d===2?3:5),a=D(ri(11,99),1),e,ans,steps;
  if(isInt(a))return null;
  if(k===0){e='0.25×'+F(a)+'×4';ans=a;steps=['运用乘法交换律，先算 0.25×4 = 1','原式 = 0.25×4×'+F(a)+' = 1×'+F(a)+' = '+F(a)];}
  else if(k===1){e='1.25×'+F(a)+'×8';ans=R(a*10);steps=['运用乘法交换律，先算 1.25×8 = 10','原式 = 1.25×8×'+F(a)+' = 10×'+F(a)+' = '+F(ans)];}
  else if(k===2){var b=D(ri(11,89),1),c=R(10-b);if(isInt(b))return null;e=F(a)+'×'+F(b)+'+'+F(a)+'×'+F(c);ans=R(a*10);
    steps=['两个乘法算式都有 '+F(a)+'，运用乘法分配律','原式 = '+F(a)+'×('+F(b)+'+'+F(c)+') = '+F(a)+'×10 = '+F(ans)];}
  else if(k===3){e=F(a)+'×10.1';ans=R(a*10.1);steps=['把 10.1 看成 10+0.1，运用乘法分配律','原式 = '+F(a)+'×10 + '+F(a)+'×0.1 = '+F(R(a*10))+' + '+F(R(a*0.1))+' = '+F(ans)];}
  else if(k===4){e=F(a)+'×99';ans=R(a*99);steps=['把 99 看成 100−1，运用乘法分配律','原式 = '+F(a)+'×100 − '+F(a)+' = '+F(R(a*100))+' − '+F(a)+' = '+F(ans)];}
  else{var b2=D(ri(21,99),1),c2=R(b2-1);if(isInt(b2))return null;e=F(a)+'×'+F(b2)+'-'+F(a)+'×'+F(c2);ans=a;
    steps=['两个乘法算式都有 '+F(a)+'，运用乘法分配律','原式 = '+F(a)+'×('+F(b2)+'−'+F(c2)+') = '+F(a)+'×1 = '+F(a)];}
  return {text:'用简便方法计算：'+e.replace(/-/g,'−')+' = ?',expr:e,answer:ans,unit:'',steps:steps,v:{}};
});
T('dm_calc3','dm',[2,3],'calc',function(d){
  var k=ri(0,2),e,ans,steps;
  if(k===0){var a=D(ri(11,99),1),b=ri(2,9),c=D(ri(11,99),1);if(isInt(a)||isInt(c))return null;var m=R(a*b);ans=R(m+c);
    e=F(a)+'×'+b+'+'+F(c);steps=['先算乘法：'+F(a)+'×'+b+' = '+F(m),'再算加法：'+F(m)+' + '+F(c)+' = '+F(ans)];}
  else if(k===1){var a1=D(ri(11,60),1),b1=D(ri(11,60),1),c1=d===3?D(ri(12,49),1):ri(2,9);var s=R(a1+b1);ans=R(s*c1);
    if(isInt(a1)||isInt(b1)||dp(ans)>2)return null;
    e='('+F(a1)+'+'+F(b1)+')×'+F(c1);steps=['先算括号里的：'+F(a1)+' + '+F(b1)+' = '+F(s),'再算乘法：'+F(s)+' × '+F(c1)+' = '+F(ans)];}
  else{var b3=D(ri(11,50),1),c3=ri(2,6),m3=R(b3*c3),a3=R(m3+D(ri(5,99),1));if(isInt(b3))return null;ans=R(a3-m3);
    e=F(a3)+'-'+F(b3)+'×'+c3;steps=['先算乘法：'+F(b3)+'×'+c3+' = '+F(m3),'再算减法：'+F(a3)+' − '+F(m3)+' = '+F(ans)];}
  return {text:'计算：'+e.replace(/-/g,'−')+' = ?',expr:e,answer:ans,unit:'',steps:steps,v:{}};
});
var FRUITS=[['苹果',55,98],['香蕉',35,68],['葡萄',85,158],['草莓',185,298],['橘子',38,65],['梨',45,78]];
T('dm_price','dm',[1,3],'app',function(d){
  var f=pick(FRUITS),p=D(ri(f[1],f[2]),1),w=d===1?ri(2,6):D(ri(12,45),1);
  if(isInt(p)||(d>1&&isInt(w)))return null;
  var t=R(p*w),steps=['总价 = 单价 × 数量','买'+f[0]+'要付：'+F(p)+' × '+F(w)+' = '+F(t)+'（元）'];
  if(d===3){var pay=t<50?50:100;if(t>=pay)return null;var ans=R(pay-t);steps.push('应找回：'+pay+' − '+F(t)+' = '+F(ans)+'（元）');steps.push('答：应找回 '+F(ans)+' 元。');
    return {text:'水果店里'+f[0]+'每千克'+F(p)+'元，妈妈买了'+F(w)+'千克，付给售货员'+pay+'元，应找回多少元？',answer:ans,unit:'元',steps:steps,v:{p:p,w:w,pay:pay}};}
  steps.push('答：一共要付 '+F(t)+' 元。');
  return {text:'水果店里'+f[0]+'每千克'+F(p)+'元，妈妈买了'+F(w)+'千克，一共要付多少元？',answer:t,unit:'元',steps:steps,v:{p:p,w:w}};
});
T('dm_step','dm',[1,2],'app',function(d){
  var n=NAMES[ri(0,9)],s=D(ri(52,68),2),k=ri(30,90)*10,ans=R(s*k);
  if(s*100%10===0)return null;
  return {text:n+'每步大约长'+F(s)+'米，从家走到学校一共走了'+k+'步。'+n+'家到学校大约有多少米？',answer:ans,unit:'米',
    steps:['路程 = 每步的长度 × 步数',F(s)+' × '+k+' = '+F(ans)+'（米）','答：大约有 '+F(ans)+' 米。'],v:{s:s,k:k}};
});
T('dm_taxi','dm',[2,3],'app',function(d){
  var b=pick([8,10,11,13]),r=D(ri(15,26),1),km=ri(5,15),ex=km-3,ans=R(b+ex*r);
  if(isInt(r))return null;
  return {text:'某城市出租车收费标准：3千米以内（含3千米）收费'+b+'元，超过3千米的部分每千米收费'+F(r)+'元。妈妈乘出租车行驶了'+km+'千米，应付车费多少元？',answer:ans,unit:'元',
    steps:['先求超过3千米的部分：'+km+' − 3 = '+ex+'（千米）','超出部分的车费：'+F(r)+' × '+ex+' = '+F(R(ex*r))+'（元）','再加上起步价：'+b+' + '+F(R(ex*r))+' = '+F(ans)+'（元）','答：应付车费 '+F(ans)+' 元。'],v:{b:b,r:r,km:km}};
});
T('dm_rect','dm',[1,3],'app',function(d){
  var a,b;
  if(d<3){a=D(ri(35,120),1);b=D(ri(15,60),1);if(isInt(a)||isInt(b)||b>=a)return null;var s=R(a*b);
    return {text:'一块长方形菜地长'+F(a)+'米，宽'+F(b)+'米。这块菜地的面积是多少平方米？',answer:s,unit:'平方米',
      steps:['长方形的面积 = 长 × 宽',F(a)+' × '+F(b)+' = '+F(s)+'（平方米）','答：面积是 '+F(s)+' 平方米。'],v:{a:a,b:b}};}
  a=D(ri(35,120),1);b=ri(4,12);var k=D(ri(2,9),1);if(isInt(a)||b>=a)return null;var s2=R(a*b),ans=R(s2*k);
  return {text:'一块长方形菜地长'+F(a)+'米，宽'+b+'米。如果每平方米施肥'+F(k)+'千克，这块地一共要施肥多少千克？',answer:ans,unit:'千克',
    steps:['先求面积：'+F(a)+' × '+b+' = '+F(s2)+'（平方米）','再求化肥：'+F(s2)+' × '+F(k)+' = '+F(ans)+'（千克）','答：一共要施肥 '+F(ans)+' 千克。'],v:{a:a,b:b,k:k}};
});
T('dm_water','dm',[2,3],'app',function(d){
  var n=pick(NAMES);
  if(d===2){var p=D(ri(25,45),1),t=ri(8,20),ans=R(p*t);if(isInt(p))return null;
    return {text:'自来水每吨'+F(p)+'元，'+n+'家上个月用水'+t+'吨。上个月应交水费多少元？',answer:ans,unit:'元',steps:['水费 = 每吨的价钱 × 吨数',F(p)+' × '+t+' = '+F(ans)+'（元）','答：应交水费 '+F(ans)+' 元。'],v:{p:p,t:t}};}
  var lim=pick([10,12,15]),p1=D(ri(25,35),1),p2=R(p1+D(ri(10,20),1)),t2=lim+ri(2,9);
  if(isInt(p1)||isInt(p2))return null;
  var c1=R(lim*p1),c2=R((t2-lim)*p2),ans2=R(c1+c2);
  return {text:'某市实行阶梯水价：每户每月用水不超过'+lim+'吨，每吨'+F(p1)+'元；超过'+lim+'吨的部分，每吨'+F(p2)+'元。'+n+'家这个月用水'+t2+'吨，应交水费多少元？',answer:ans2,unit:'元',
    steps:['前'+lim+'吨的水费：'+lim+' × '+F(p1)+' = '+F(c1)+'（元）','超出部分：'+t2+' − '+lim+' = '+(t2-lim)+'（吨），水费 '+(t2-lim)+' × '+F(p2)+' = '+F(c2)+'（元）','合计：'+F(c1)+' + '+F(c2)+' = '+F(ans2)+'（元）','答：应交水费 '+F(ans2)+' 元。'],v:{lim:lim,p1:p1,p2:p2,t:t2}};
});
T('dm_oil','dm',[1,2],'app',function(d){

    steps:['求'+m+'个'+F(r)+'千克是多少，用乘法',F(r)+' × '+m+' = '+F(ans)+'（千克）','答：大约可以榨油 '+F(ans)+' 千克。'],v:{r:r,m:m}};
});
T('dm_speed','dm',[1,3],'app',function(d){

      steps:['先求一共行驶的时间：'+F(t)+' + '+F(t2)+' = '+F(R(t+t2))+'（小时）','路程 = 速度 × 时间：'+v+' × '+F(R(t+t2))+' = '+F(tot)+'（千米）','答：一共行驶了 '+F(tot)+' 千米。'],v:{v:v,t:t,t2:t2}};}
  return {text:'一辆汽车每小时行驶'+v+'千米，'+F(t)+'小时行驶多少千米？',answer:s,unit:'千米',
    steps:['路程 = 速度 × 时间',v+' × '+F(t)+' = '+F(s)+'（千米）','答：行驶了 '+F(s)+' 千米。'],v:{v:v,t:t}};

 S.mOk=Math.random()<m.acc;S.mDone=false;S.mShown=0;S.lastSay=0;

function tick(){
 if(!S||S.answered)return;
 var el=(performance.now()-S.t0)/1000,prog=Math.min(1,el*SPEED/S.mt);
 $('#mBar').style.width=(prog*100).toFixed(1)+'%';

 else if(!S.mDone&&el-S.lastSay>2.6){S.lastSay=el;$('#mSay').innerHTML='<span class="dotty">'+esc(pickOne(TXT.think))+'</span>';var sc=$('#scribble');sc.textContent=pickOne(SCRIB);sc.classList.remove('fly');void sc.offsetWidth;sc.classList.add('fly');}

function submit(timeout,skipped){
 if(!S||S.answered)return;var p=S.cur;
 if(!timeout&&!skipped){
  if(p.choices&&S.choice<0){toast('先选一个答案哦～');return;}
  if(!p.choices&&(S.input===''||isNaN(G.parseNum(S.input)))){var b=$('#ansbox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast('先输入答案哦～');return;}
 }
 S.answered=true;clearInterval(tickT);
 var t=Math.round((performance.now()-S.t0)/100)/10;
 var ok=!timeout&&!skipped&&G.check(p,p.choices?S.choice:S.input);
 var me=S.me;me.streak=ok?me.streak+1:0;me.maxStreak=Math.max(me.maxStreak,me.streak);if(ok)me.correct++;
 var sc=scoreOf(ok,t,p.par,me.streak,S.hint);me.score+=sc.total;
 var shown=timeout?'（时间到）':skipped?'（跳过）':(p.choices?p.choices[S.choice]:S.input);
 me.res.push({ok:ok,t:t,input:shown,hint:S.hint,sc:sc});
 if(ok&&p.kind==='app'&&t<10)S.fast=true;
 var mi=S.mi;mi.streak=S.mOk?mi.streak+1:0;mi.maxStreak=Math.max(mi.maxStreak,mi.streak);if(S.mOk)mi.correct++;
 var msc=scoreOf(S.mOk,S.mt,p.par,mi.streak,false);mi.score+=msc.total;mi.res.push({ok:S.mOk,t:S.mt,sc:msc});
 var mb=$('#mBar');mb.style.transition='width .5s';mb.style.width='100%';$('#miuyaBox').classList.add('done');
 $('#mSay').textContent=ok&&S.mOk?pickOne(TXT.both):ok?pickOne(TXT.meOnly):S.mOk?pickOne(TXT.miOnly):pickOne(TXT.none);
 $('#timer').classList.remove('show');
 paintRace();
 if(ok){SFX.ok();if(me.streak>=3)toast('连对 '+me.streak+' 题，势不可挡！');}else SFX.no();

 var st=store.stats;st.rounds++;if(res==='win'){st.wins++;if(S.topic!=='all')st.topicWins[S.topic]=(st.topicWins[S.topic]||0)+1;}

 var rec={date:Date.now(),d:S.d,topic:S.topic,score:me.score,mscore:mi.score,correct:me.correct,res:res,stars:stars};
 store.history.unshift(rec);store.history=store.history.slice(0,30);

 if(me.correct===10)award('perfect',nb);if(me.maxStreak>=5)award('combo5',nb);if(me.maxStreak>=8)award('combo8',nb);if(S.fast)award('speed',nb);

 if(Object.keys(G.TOPICS).every(function(k){return st.topicWins[k];}))award('all_topics',nb);

}
function renderBadges(){
 var h='<div class="pagehead"><button class="iconbtn" data-act="home" aria-label="返回">'+IC.back+'</button><h2>徽章墙</h2><span class="tag sun">'+Object.keys(store.badges).length+' / '+BADGES.length+'</span></div><div class="bgrid">'+
  BADGES.map(function(b){var got=store.badges[b[0]];return '<div class="badge '+(got?'':'lock')+'">'+badgeSVG(got?b:[b[0],'?','',b[3],'#bbb','#ddd'])+'<b>'+b[2]+'</b><small>'+b[3]+(got?'<br>'+new Date(got).toLocaleDateString('zh-CN'):'')+'</small></div>';}).join('')+'</div>';
 $('#badgesWrap').innerHTML=h;
}
function fmtDate(t){var d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function topicName(t){return t==='all'?'综合':G.TOPICS[t];}
function renderRecords(){
 var st=store.stats,acc=st.total?Math.round(st.correct/st.total*100):0;
 var h='<div class="pagehead"><button class="iconbtn" data-act="home" aria-label="返回">'+IC.back+'</button><h2>成绩记录</h2></div>'+
  '<div class="sumg"><div>总局数<b>'+st.rounds+'</b></div><div>赢 Miuya<b>'+st.wins+'</b></div><div>正确率<b>'+acc+'%</b></div><div>等级<b>Lv.'+levelInfo(store.xp).lv+'</b></div></div>'+
  '<div class="card"><h3 style="margin-bottom:6px">最高分排行</h3>'+(store.best.length?'<table class="rec"><tr><th>#</th><th>得分</th><th>难度·专题</th><th>答对</th><th>日期</th></tr>'+store.best.map(function(r,i){return '<tr><td>'+(i+1)+'</td><td><b>'+r.score+'</b></td><td>'+DIFF_NAME[r.d]+'·'+topicName(r.topic)+'</td><td>'+r.correct+'/10</td><td>'+fmtDate(r.date)+'</td></tr>';}).join('')+'</table>':'<div class="empty">还没有成绩，快去和 Miuya 比一比吧！</div>')+'</div><div style="height:12px"></div>'+
  '<div class="card"><h3 style="margin-bottom:6px">最近对战</h3>'+(store.history.length?'<table class="rec"><tr><th>时间</th><th>结果</th><th>比分</th><th>难度·专题</th></tr>'+store.history.slice(0,20).map(function(r){return '<tr><td>'+fmtDate(r.date)+'</td><td class="'+{win:'w',lose:'l',tie:'t'}[r.res][0]+'">'+{win:'胜',lose:'惜败',tie:'平'}[r.res]+'</td><td>'+r.score+' : '+r.mscore+'</td><td>'+DIFF_NAME[r.d]+'·'+topicName(r.topic)+'</td></tr>';}).join('')+'</table>':'<div class="empty">暂无记录</div>')+'</div>'+
  '<div style="text-align:center;margin-top:14px"><button class="btn ghost" data-act="clear" style="font-size:14px">清空记录</button></div>';
 $('#recordsWrap').innerHTML=h;
}

/* ---------- 事件 ---------- */
document.addEventListener('click',function(e){
 var t=e.target.closest('button');if(!t)return;
 if(t.dataset.k){press(t.dataset.k);return;}
 if(t.dataset.diff){store.settings.diff=+t.dataset.diff;save();SFX.tap();renderHome();return;}
 if(t.dataset.topic){store.settings.topic=t.dataset.topic;save();SFX.tap();renderHome();return;}
 if(t.dataset.choice!==undefined){if(!S||S.answered)return;S.choice=+t.dataset.choice;SFX.tap();$$('[data-choice]').forEach(function(b){b.classList.toggle('sel',+b.dataset.choice===S.choice);});return;}
 if(t.dataset.rv){rvMode=t.dataset.rv;renderReview();window.scrollTo(0,0);return;}
 var a=t.dataset.act;if(!a)return;
 switch(a){
  case 'mute':store.settings.sound=!store.settings.sound;save();paintMute();$('[data-act="sound"]').classList.toggle('on',store.settings.sound);if(store.settings.sound)SFX.tap();break;
  case 'sound':store.settings.sound=!store.settings.sound;save();renderHome();SFX.tap();break;
  case 'timer':store.settings.timer=!store.settings.timer;save();renderHome();SFX.tap();toast(store.settings.timer?'已开启每题限时，加油！':'已关闭限时，慢慢想～');break;
  case 'start':case 'again':SFX.tap();startRound();break;
  case 'submit':submit(false,false);break;
  case 'skip':confirmBox('要跳过这道题吗？跳过算答错，但能马上看到解题思路哦～','跳过','再想想',function(y){if(y)submit(false,true);});break;
  case 'next':SFX.tap();nextQ();break;
  case 'hint':if(!S||S.answered)return;S.hint=true;$('#hintbox').innerHTML='<b>提示：</b>'+esc(S.cur.steps[0]);$('#hintbox').classList.add('show');t.style.display='none';checkMore();toast('用了提示，本题答对得 70 分');break;
  case 'togglesteps':var fs=$('#fbSteps');fs.style.display=fs.style.display==='none'?'block':'none';break;
  case 'quit':confirmBox('要退出这一局吗？本局成绩不会保存哦。','退出','继续答题',function(y){if(y){clearInterval(tickT);hideSheet();S=null;renderHome();show('home');}});break;
  case 'home':hideSheet();renderHome();show('home');break;
  case 'review':rvMode='wrong';renderReview();show('review');break;
  case 'toResult':show('result');$$('#resStars svg').forEach(function(s,i){if(i<S.result.stars)s.classList.add('lit');});break;
  case 'badges':renderBadges();show('badges');break;
  case 'records':renderRecords();show('records');break;
  case 'clear':confirmBox('确定要清空成绩记录吗？（等级和徽章会保留）','清空','不了',function(y){if(y){store.best=[];store.history=[];save();renderRecords();toast('记录已清空');}});break;
 }
});
$('#pname').addEventListener('change',function(){store.name=this.value.trim().slice(0,8)||'我';this.value=store.name;save();toast('你好，'+store.name+'！');});
$('#pname').addEventListener('keydown',function(e){if(e.key==='Enter')this.blur();e.stopPropagation();});
document.addEventListener('keydown',function(e){
 if($('#modal').classList.contains('show')){if(e.key==='Escape')$('#modalNo').click();if(e.key==='Enter')$('#modalYes').click();return;}
 if(!$('#scr-game').classList.contains('active')||!S)return;
 if(S.answered){if(e.key==='Enter'||e.key===' '){e.preventDefault();nextQ();}return;}
 if(S.cur.choices){var n=parseInt(e.key,10);if(n>=1&&n<=S.cur.choices.length){var b=$$('[data-choice]')[n-1];if(b)b.click();}if(e.key==='Enter')submit(false,false);return;}
 var k=null;if(/^\d$/.test(e.key))k=e.key;else if(e.key==='.'||e.key==='Decimal')k='.';else if(e.key==='Backspace')k='del';else if(e.key==='Escape'||e.key==='Delete')k='clr';
 if(k){e.preventDefault();press(k);var btn=$('[data-k="'+k+'"]');if(btn){btn.classList.add('press');setTimeout(function(){btn.classList.remove('press');},120);}}
 else if(e.key==='Enter'){e.preventDefault();submit(false,false);}
});
$('#mask').addEventListener('click',function(){/* 需点“下一题”，防误触 */});
$('#qcard').addEventListener('scroll',checkMore,{passive:true});
window.addEventListener('resize',function(){if(S&&$('#scr-game').classList.contains('active'))checkMore();});

/* ---------- 启动 ---------- */
$$('[data-act="quit"]').forEach(function(b){b.innerHTML=IC.close;});
paintAvatars();renderHome();
window.MathPK={get state(){return S;},get store(){return store;},gen:G,reset:function(){store=defStore();save();renderHome();}};
})();
</script>
</body>
