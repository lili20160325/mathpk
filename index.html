<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe4f0">
<title>数学PK赛 · 和 Miuya 比一比</title>
<style>
:root{--pink:#ff6fa5;--pink2:#ffd1e3;--purple:#8e6bff;--purple2:#e6ddff;--mint:#2fbf94;--mint2:#d6f7ec;--coral:#ff8a7a;--coral2:#ffe3de;--sun:#ffc93c;--ink:#43315e;--ink2:#7a6a93;--card:#fff;--r:20px;--shadow:0 6px 18px rgba(142,107,255,.14);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;color:var(--ink);background:linear-gradient(160deg,#ffe4f0 0%,#f3eaff 45%,#e3f1ff 100%) fixed;overscroll-behavior:none;-webkit-user-select:none;user-select:none;}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.screen{display:none;min-height:100vh;min-height:100dvh;}
.screen.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px 28px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.row{display:flex;align-items:center;gap:10px}
.btn{border-radius:18px;padding:14px 18px;font-size:18px;font-weight:700;background:#fff;box-shadow:0 4px 0 rgba(67,49,94,.12);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(67,49,94,.12)}
.btn.primary{background:linear-gradient(180deg,#ff8dba,#ff5d98);color:#fff;box-shadow:0 5px 0 #d94a80}
.btn.purple{background:linear-gradient(180deg,#a68bff,#7f5cff);color:#fff;box-shadow:0 5px 0 #6243d6}
.btn.mint{background:linear-gradient(180deg,#4fd6ad,#25b488);color:#fff;box-shadow:0 5px 0 #1b8f6b}
.btn.ghost{background:rgba(255,255,255,.7)}
.iconbtn{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.85);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(67,49,94,.1)}
.iconbtn svg{width:24px;height:24px}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--purple2);color:#6a4bd8}
.tag.pink{background:var(--pink2);color:#d63e7a}.tag.mint{background:var(--mint2);color:#138a66}.tag.sun{background:#fff1c7;color:#a8740a}
h1,h2,h3{margin:0}
/* ---------- 首页 ---------- */
.home-top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#ff5d98,#8e6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--ink2);font-size:14px;margin-top:2px}
.hero{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 6px;position:relative}
.hero .av{width:108px;height:108px}
.vs{font-size:34px;font-weight:900;color:var(--sun);text-shadow:0 3px 0 #e59f00,0 0 12px #fff;transform:rotate(-8deg)}
.bubble{position:relative;background:#fff;border-radius:16px;padding:8px 12px;font-size:14px;box-shadow:var(--shadow);max-width:260px}
.hero-say{text-align:center;margin:0 auto 12px;width:fit-content}
.hero-say:after{content:"";position:absolute;right:30px;top:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
.player{display:flex;align-items:center;gap:12px}
.player .av{width:56px;height:56px;flex:none}
.pname{font-size:18px;font-weight:800;border:2px dashed transparent;border-radius:10px;padding:2px 6px;background:transparent;font-family:inherit;color:var(--ink);width:9em;outline:none}
.pname:focus{border-color:var(--pink2);background:#fff8fb}
.lvl{font-size:13px;color:var(--ink2)}
.xpbar{height:10px;border-radius:99px;background:#f1eafe;overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb3d0,#a68bff);border-radius:99px;transition:width .6s}
.sec-title{font-size:16px;font-weight:800;margin:16px 4px 8px;display:flex;align-items:center;gap:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg button{background:#fff;border-radius:18px;padding:12px 6px;box-shadow:0 4px 0 rgba(67,49,94,.08);border:3px solid transparent;min-height:72px}
.seg button b{display:block;font-size:19px}
.seg button small{display:block;color:var(--ink2);font-size:12px;margin-top:3px}
.seg button.on{border-color:var(--pink);background:#fff4f9}
.topics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.topics button{background:#fff;border-radius:16px;padding:12px 4px;font-size:15px;font-weight:700;min-height:56px;border:3px solid transparent;box-shadow:0 4px 0 rgba(67,49,94,.08)}
.topics button.on{border-color:var(--purple);background:#f7f3ff;color:#5b3fd0}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tgl{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;font-weight:700;min-height:56px;box-shadow:0 4px 0 rgba(67,49,94,.08);width:100%;font-size:15px}
.sw{width:50px;height:30px;border-radius:99px;background:#e2dcea;position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15);transition:.2s}
.tgl.on .sw{background:var(--mint)}.tgl.on .sw:after{left:23px}
.go{width:100%;font-size:24px;padding:18px;margin-top:18px;letter-spacing:4px}
.home-links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.home-links .btn{font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.home-links svg{width:22px;height:22px}
@media(min-width:900px){
  .home-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:22px;align-items:start}
  .hero .av{width:150px;height:150px}
}
/* ---------- 游戏 ---------- */
#scr-game.active{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.g-top{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;flex:none}
.g-top .qno{font-weight:900;font-size:17px}
.g-top .grow{flex:1}
.timer{font-weight:800;font-size:15px;background:#fff;border-radius:99px;padding:5px 12px;display:none;align-items:center;gap:4px}
.timer.show{display:inline-flex}.timer.low{background:var(--coral2);color:#d4513f}
.g-body{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 12px 10px;gap:8px;max-width:1240px;width:100%;margin:0 auto}
.g-left,.g-right{display:flex;flex-direction:column;gap:8px;min-height:0}
.g-left{flex:1}
.race{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:8px 10px;display:flex;flex-direction:column;gap:6px;flex:none}
.lane{display:flex;align-items:center;gap:8px}
.lane .av{width:30px;height:30px;flex:none}
.lane .nm{font-weight:800;font-size:14px;width:4.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;flex:1}
.dots i{flex:1;height:10px;border-radius:99px;background:#efe9f7;max-width:26px}
.dots i.ok{background:var(--mint)}.dots i.no{background:#ffb4a8}.dots i.cur{background:#ffe08a;box-shadow:0 0 0 2px #ffcf4a inset}
.lane .sc{font-weight:900;font-size:16px;min-width:3.2em;text-align:right}
.combo{font-size:12px;font-weight:800;color:#e0558b;background:#ffe6f0;border-radius:99px;padding:1px 7px;display:none;white-space:nowrap}
.combo.show{display:inline-block;animation:pop .3s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.miuya{background:linear-gradient(135deg,#f5f0ff,#fff);border-radius:18px;box-shadow:var(--shadow);padding:8px 10px;display:flex;align-items:center;gap:10px;flex:none;position:relative}
.miuya .av{width:48px;height:48px;flex:none;animation:bob 1.6s ease-in-out infinite}
.miuya.done .av{animation:hop .6s ease}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.m-info{flex:1;min-width:0}
.m-say{font-size:14px;font-weight:700;color:#6a4bd8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-say .dotty:after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.m-bar{height:12px;border-radius:99px;background:#ebe4fb;margin-top:6px;overflow:hidden;position:relative}
.m-bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:repeating-linear-gradient(45deg,#a68bff 0 10px,#b9a3ff 10px 20px);background-size:28px 28px;animation:stripes 1s linear infinite}
@keyframes stripes{to{background-position:28px 0}}
.miuya.done .m-bar i{background:linear-gradient(90deg,#a68bff,#ff8dba);animation:none}
.m-pen{font-size:12px;color:var(--ink2);margin-left:auto;white-space:nowrap;font-weight:700}
.scribble{position:absolute;right:12px;top:-6px;font-size:13px;font-weight:800;color:#b7a4f5;opacity:0;pointer-events:none}
.scribble.fly{animation:fly 1.6s ease-out}
@keyframes fly{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.qcard{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:14px 16px;flex:1;min-height:0;overflow:auto;position:relative}
.qtags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qtext{font-size:19px;line-height:1.65;white-space:pre-line;font-weight:500;-webkit-user-select:text;user-select:text}
.fig{display:flex;justify-content:center;margin-top:8px}
.fig svg{width:100%;max-width:300px;height:auto}
.hintbtn{margin-left:auto;background:#fff7d6;color:#a8740a;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:4px}
.hintbox{margin-top:10px;background:#fffaf0;border:2px dashed #ffd66b;border-radius:14px;padding:8px 12px;font-size:15px;display:none}
.hintbox.show{display:block;animation:fadein .2s}
.ansrow{display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:8px 12px;flex:none}
.ansrow .lab{font-weight:800;font-size:17px}
.ansbox{flex:1;min-height:46px;border-radius:14px;background:#f8f5ff;border:3px solid #ddd0ff;font-size:26px;font-weight:800;display:flex;align-items:center;padding:0 12px;letter-spacing:1px;overflow:hidden}
.ansbox .ph{color:#c2b6dc;font-size:16px;font-weight:600;letter-spacing:0}
.ansbox .caret{display:inline-block;width:3px;height:28px;background:var(--pink);margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.ansbox.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.unit{font-weight:800;font-size:17px;color:var(--ink2);white-space:nowrap}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:none}
.pad button{height:52px;border-radius:16px;background:#fff;font-size:26px;font-weight:800;box-shadow:0 4px 0 rgba(67,49,94,.12)}
.pad button:active,.pad button.press{transform:translateY(3px);box-shadow:0 1px 0 rgba(67,49,94,.12);background:#fff4f9}
.pad .fn{font-size:17px;background:#f4efff;color:#6a4bd8}
.pad .ok{grid-row:span 2;height:auto;background:linear-gradient(180deg,#ff8dba,#ff5d98);color:#fff;font-size:22px;box-shadow:0 5px 0 #d94a80}
.pad .skip{font-size:15px;background:#fff;color:var(--ink2)}
.choices{display:grid;gap:10px;flex:none}
.choices button{min-height:56px;border-radius:18px;background:#fff;font-size:19px;font-weight:800;box-shadow:0 4px 0 rgba(67,49,94,.12);border:3px solid transparent;padding:8px 12px}
.choices button.sel{border-color:var(--pink);background:#fff4f9}
.choices.two{grid-template-columns:1fr 1fr}.choices.three{grid-template-columns:1fr 1fr 1fr}
.choices-foot{display:grid;grid-template-columns:1fr 2fr;gap:10px}
@media(min-width:900px){
  .g-body{flex-direction:row;gap:16px;padding:4px 20px 16px}
  .g-right{width:390px;flex:none}
  .miuya{padding:12px 14px}.miuya .av{width:84px;height:84px}
  .m-say{font-size:16px;white-space:normal}
  .qtext{font-size:22px}
  .fig svg{max-width:380px}
  .pad button{height:62px}
  .race{padding:12px 14px}.lane .av{width:36px;height:36px}.dots i{height:12px}
}
.more-cue{display:none}
.qcard.more .more-cue{display:block;position:sticky;bottom:-14px;margin:6px -16px -14px;padding:14px 0 8px;text-align:center;font-size:13px;font-weight:800;color:#8e6bff;background:linear-gradient(rgba(255,255,255,0),#fff 55%);pointer-events:none}
.qcard.more .more-cue span{display:inline-block;background:#f3eeff;border-radius:99px;padding:3px 12px;animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(3px)}}
@media(max-width:899px){
  .qcard .fig svg{max-height:min(30vh,210px)}
  #scr-game.hasfig .pad button{height:46px}
  #scr-game.hasfig .pad .ok{height:auto}
  #scr-game.hasfig .miuya{padding:6px 10px}#scr-game.hasfig .miuya .av{width:40px;height:40px}
}
@media(max-height:700px) and (max-width:899px){.pad button{height:44px}.qtext{font-size:17px}.miuya .av{width:38px;height:38px}}
/* ---------- 反馈 ---------- */
.mask{position:fixed;inset:0;background:rgba(67,49,94,.28);display:none;z-index:20}
.mask.show{display:block;animation:fadein .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(67,49,94,.2);padding:16px 18px calc(16px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.9,.3,1.1),visibility 0s linear .28s;max-width:640px;margin:0 auto}
.sheet.show{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.9,.3,1.1)} /* 收起时隐藏，免得阴影从底边露出来、也免得键盘 Tab 到看不见的按钮 */
.fb-head{display:flex;align-items:center;gap:12px}
.fb-head .big{font-size:26px;font-weight:900}
.fb-head.ok .big{color:var(--mint)}.fb-head.no .big{color:#f07a67}
.fb-head svg{width:52px;height:52px;flex:none}
.fb-msg{color:var(--ink2);font-size:15px;margin-top:2px}
.fb-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.fb-cell{background:#faf7ff;border-radius:14px;padding:8px 10px;font-size:14px}
.fb-cell b{font-size:18px;display:block;margin-top:2px;word-break:break-all}
.pts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.pts span{font-size:13px;font-weight:800;border-radius:99px;padding:3px 10px;background:var(--mint2);color:#138a66}
.pts span.m{background:var(--purple2);color:#6a4bd8}
.steps{background:#fffaf2;border-radius:16px;padding:10px 12px 10px 12px;margin-top:6px}
.steps h4{margin:0 0 6px;font-size:15px;color:#a8740a;display:flex;align-items:center;gap:6px}
.steps ol{margin:0;padding-left:22px;font-size:15.5px;line-height:1.7}
.steps li::marker{color:#e2a31a;font-weight:800}
.fb-actions{display:flex;gap:10px;margin-top:12px}
.fb-actions .btn{flex:1}
.toggle-steps{background:none;color:#a8740a;font-weight:800;font-size:15px;padding:6px 0}
/* ---------- 结果 ---------- */
.res-banner{text-align:center;padding:10px 0 4px;position:relative}
.res-banner h2{font-size:30px;font-weight:900;margin-top:4px}
.res-banner p{color:var(--ink2);margin:6px 0 0;font-size:15px}
.trophy{width:120px;height:120px;margin:0 auto;animation:pop .6s}
.stars{display:flex;justify-content:center;gap:8px;margin:8px 0}
.stars svg{width:54px;height:54px;opacity:.25;transform:scale(.6);transition:.35s cubic-bezier(.2,.9,.3,1.4)}
.stars svg.lit{opacity:1;transform:scale(1)}
.stars svg:nth-child(2){margin-top:-12px}
.vsbox{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:10px 0}
.vsbox .side{text-align:center}
.vsbox .av{width:62px;height:62px}
.vsbox .num{font-size:30px;font-weight:900}
.vsbox .win{position:relative}
.vsbox .crown{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:34px}
.statg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.statg div{background:#faf7ff;border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;color:var(--ink2)}
.statg b{display:block;font-size:20px;color:var(--ink)}
.newbadges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0}
.res-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.res-actions .wide{grid-column:span 2}
.lvup{background:linear-gradient(90deg,#fff1c7,#ffe4f0);border-radius:14px;padding:8px 12px;text-align:center;font-weight:800;margin:8px 0;animation:pop .5s}
@media(min-width:900px){.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}}
/* ---------- 回顾 / 徽章 / 记录 ---------- */
.pagehead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pagehead h2{font-size:22px;font-weight:900;flex:1}
.rv{margin-bottom:12px}
.rv .qtext{font-size:17px}
.rv-ans{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.rv-ans span{border-radius:12px;padding:6px 10px;font-weight:800;font-size:15px}
.rv-ans .me{background:var(--coral2);color:#c9503e}.rv-ans .right{background:var(--mint2);color:#138a66}
.rv-filter{display:flex;gap:8px;margin-bottom:12px}
.rv-filter button{border-radius:99px;padding:8px 16px;font-weight:800;background:#fff;font-size:15px}
.rv-filter button.on{background:var(--purple);color:#fff}
.allgood{text-align:center;padding:24px 10px}
.allgood svg{width:110px;height:110px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:#fff;border-radius:18px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.badge svg{width:64px;height:64px}
.badge b{display:block;font-size:15px;margin-top:4px}
.badge small{display:block;color:var(--ink2);font-size:12px;margin-top:2px;line-height:1.4}
.badge.lock{opacity:.55;filter:grayscale(1)}
.mini-badge{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;width:74px;animation:pop .5s}
.mini-badge svg{width:52px;height:52px}
table.rec{width:100%;border-collapse:collapse;font-size:14px}
table.rec th{color:var(--ink2);font-weight:700;text-align:left;padding:6px 4px;border-bottom:2px solid #f1eafe}
table.rec td{padding:8px 4px;border-bottom:1px solid #f5f0fb}
.w{color:var(--mint);font-weight:800}.l{color:#e88a7a;font-weight:800}.t{color:#a8740a;font-weight:800}
.empty{color:var(--ink2);text-align:center;padding:18px}
.sumg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sumg div{background:#fff;border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;color:var(--ink2);box-shadow:var(--shadow)}
.sumg b{display:block;font-size:20px;color:var(--ink)}
/* ---------- 弹窗 / 提示 / 彩带 ---------- */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:40;background:rgba(67,49,94,.35);padding:20px}
.modal.show{display:flex;animation:fadein .2s}
.modal .card{max-width:360px;width:100%;text-align:center}
.modal p{font-size:17px;margin:10px 0 16px}
.modal .row{justify-content:center}
.modal .btn{flex:1}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-80px);background:#fff;border-radius:99px;padding:10px 18px;font-weight:800;box-shadow:var(--shadow);z-index:50;transition:transform .3s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}

 {adj:'年龄大',opp:'年龄小',top:'年龄最大',bot:'年龄最小',x:function(a,b){return a+'比'+b+'大';},y:function(a,b){return b+'比'+a+'小';},intro:'比年龄'}];
function orderCount(n,cons){var c=0,sol=null;perms(n).forEach(function(pm){ // pm[k] = 排第 k 位（从“最……”开始）的人
  var pos=[];pm.forEach(function(p,k){pos[p]=k;});
  if(cons.every(function(k){return k.t==='gt'?pos[k.a]<pos[k.b]:k.t==='nottop'?pos[k.a]!==0:pos[k.a]!==n-1;})){c++;sol=pm;}});return {count:c,sol:sol};}
function orderPuzzle(L){
 var n=L<=2?3:4;
 for(var tries=0;tries<300;tries++){
  var cm=pick(CMP),people=shuffle(NAMES).slice(0,n),truth=shuffle(range(n)),pos=[];truth.forEach(function(p,k){pos[p]=k;});
  var pool=[];for(var a=0;a<n;a++)for(var b=0;b<n;b++)if(pos[a]<pos[b])pool.push({t:'gt',a:a,b:b,flip:rnd()<0.4});
  if(L>=4)for(a=0;a<n;a++){if(pos[a]!==0)pool.push({t:'nottop',a:a});if(pos[a]!==n-1)pool.push({t:'notbot',a:a});}
  pool=shuffle(pool);var cons=[];
  for(var i=0;i<pool.length;i++){cons.push(pool[i]);if(orderCount(n,cons).count===1)break;}
  for(i=cons.length-1;i>=0;i--){var tr=cons.slice(0,i).concat(cons.slice(i+1));if(orderCount(n,tr).count===1)cons=tr;}
  var texts=cons.map(function(k){if(k.t==='gt')return (k.flip?cm.y(people[k.a],people[k.b]):cm.x(people[k.a],people[k.b]))+'。';return people[k.a]+(k.t==='nottop'?'不是'+cm.top+'的':'不是'+cm.bot+'的')+'。';});
  var askK=L<=2?0:ri(0,n-1),qtxt=askK===0?'谁'+cm.top+'？':askK===n-1?'谁'+cm.bot+'？':'按从'+cm.adj+'到'+cm.opp+'排队，第 '+(askK+1)+' 个是谁？';
  var chain=truth.map(function(p){return people[p];}).join(' ＞ ');
  return {type:'order',title:cm.intro,intro:people.join('、')+(n===3?'三':'四')+'个小朋友在'+cm.intro+'。',clues:texts,prompt:qtxt,options:people.slice(),answer:truth[askK],people:people,
   hint:'把每句话变成“谁 ＞ 谁”，再把它们连成一串。比如“A比B'+cm.adj+'”就写 A ＞ B。',explain:['把关系连起来（从'+cm.adj+'到'+cm.opp+'）：'+chain+'。','所以答案是'+people[truth[askK]]+'。'],
   check:{n:n,cons:cons.map(function(k){return {t:k.t,a:k.a,b:k.b};}),truth:truth,askK:askK}};
 }
 throw new Error('order failed');
}

function pad(x){return ('0'+x).slice(-2);}
function dateStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(s,k){var p=s.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]+k);return dateStr(d);}
function daily(date,level){
 level=Math.max(1,Math.min(5,level||1));
 var base=hash('mathpk-daily|'+date+'|L'+level),save=rnd,out=[];
 try{
  var gens=[function(){return numPattern(level);},function(){return orderPuzzle(level);},function(){return level<=1||(base%2===0&&level<=3)?reasonWho(level):reasonLiar(level);},function(){return sudoku(level);},
   function(){return level<=2||base%3!==0?shapePattern(level):(base%2===0?reasonLiar(level):reasonWho(level));}];
  gens.forEach(function(g,i){rnd=RNG(base+i*7919);var p=g();p.no=i+1;p.typeName=TYPE_NAME[p.type];out.push(p);});
 }finally{rnd=save;}
 return {date:date,level:level,puzzles:out};
}
/* 难度慢慢调整：一天里 4 关以上独立做对就升一级，只对 2 关以下就降一级 */

var MIUYA={1:{acc:0.62,lo:0.7,hi:1.1},2:{acc:0.74,lo:0.5,hi:0.9},3:{acc:0.86,lo:0.35,hi:0.7}};

function scoreOf(ok,t,par,streak,hint){if(!ok)return {base:0,speed:0,combo:0,total:0};var base=hint?70:100,speed=Math.round(50*Math.max(0,Math.min(1,(1.5*par-t)/(1.5*par)))),combo=streak>=2?Math.min(streak-1,5)*10:0;return {base:base,speed:speed,combo:combo,total:base+speed+combo};}

}

 [['#meCombo',S.me],['#miCombo',S.mi]].forEach(function(x){var el=$(x[0]);if(x[1].streak>=2){el.textContent='连对×'+x[1].streak;el.classList.add('show');}else el.classList.remove('show');});

function nextQ(){
 hideSheet();
 S.i++;if(S.i>=S.probs.length)return finish();
 var p=S.probs[S.i],m=MIUYA[S.d];
 S.cur=p;S.input='';S.choice=-1;S.hint=false;S.answered=false;
 S.mt=p.par*(m.lo+Math.random()*(m.hi-m.lo))*(p.kind==='calc'?0.9:1);S.mt=Math.round(S.mt*10)/10;
 S.mOk=Math.random()<m.acc;S.mDone=false;S.mShown=0;S.lastSay=0;
 S.limit=store.settings.timer?Math.round(p.par*2):0;
 $('#qno').textContent='第 '+(S.i+1)+' / 10 题';
 $('#qTopic').textContent=p.topicName;$('#qKind').textContent=KIND_NAME[p.kind];
 $('#qtext').textContent=p.text;$('#qfig').innerHTML=renderFig(p.fig);$('#scr-game').classList.toggle('hasfig',!!p.fig);
 $('[data-act="hint"]').innerHTML=IC.bulb+'提示';$('[data-act="hint"]').style.display='';
 $('#hintbox').classList.remove('show');$('#qcard').scrollTop=0;
 $('#miuyaBox').classList.remove('done');$('#mBar').style.transition='none';$('#mBar').style.width='0%';
 $('#mSay').innerHTML='<span class="dotty">'+esc(pickOne(TXT.think))+'</span>';
 renderInput();paintRace();checkMore();
 S.t0=performance.now();clearInterval(tickT);tickT=setInterval(tick,100);tick();
}

    '<div class="pad" style="margin-top:8px">'+
    ['7','8','9','del','4','5','6','ok','1','2','3','.','0','clr','skip'].map(function(k){
      if(k==='del')return '<button class="fn" data-k="del" aria-label="退格"><svg viewBox="0 0 32 24" width="30" height="22"><path d="M10 3h18a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H10L2 12z" fill="#e6ddff" stroke="#6a4bd8" stroke-width="2" stroke-linejoin="round"/><path d="M15 8l8 8M23 8l-8 8" stroke="#6a4bd8" stroke-width="2.4" stroke-linecap="round"/></svg></button>';

function press(k){
 if(!S||S.answered||S.cur.choices)return;SFX.tap();
 if(k==='del')S.input=S.input.slice(0,-1);
 else if(k==='clr')S.input='';
 else if(k==='.'){if(S.input.indexOf('.')<0&&S.input.length<9)S.input=(S.input||'0')+'.';}
 else if(/^\d$/.test(k)&&S.input.replace('.','').length<9){if(S.input==='0')S.input=k;else S.input+=k;}
 paintAns();
}
function tick(){
 if(!S||S.answered)return;
 var el=(performance.now()-S.t0)/1000,prog=Math.min(1,el*SPEED/S.mt);
 $('#mBar').style.width=(prog*100).toFixed(1)+'%';
 if(prog>=1&&!S.mDone){S.mDone=true;$('#miuyaBox').classList.add('done');$('#mSay').textContent=pickOne(TXT.done);SFX.miuya();}
 else if(!S.mDone&&el-S.lastSay>2.6){S.lastSay=el;$('#mSay').innerHTML='<span class="dotty">'+esc(pickOne(TXT.think))+'</span>';var sc=$('#scribble');sc.textContent=pickOne(SCRIB);sc.classList.remove('fly');void sc.offsetWidth;sc.classList.add('fly');}
 if(S.limit){var left=Math.max(0,Math.ceil(S.limit-el)),t=$('#timer');t.classList.add('show');t.textContent='还剩 '+left+' 秒';t.classList.toggle('low',left<=10);if(left<=0)submit(true);}
 else $('#timer').classList.remove('show');
}
function submit(timeout,skipped){
 if(!S||S.answered)return;var p=S.cur;
 if(!timeout&&!skipped){
  if(p.choices&&S.choice<0){toast('先选一个答案哦～');return;}
  if(!p.choices&&(S.input===''||isNaN(G.parseNum(S.input)))){var b=$('#ansbox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast('先输入答案哦～');return;}
 }
 S.answered=true;clearInterval(tickT);
 var t=Math.round((performance.now()-S.t0)/100)/10;
 var ok=!timeout&&!skipped&&G.check(p,p.choices?S.choice:S.input);
 var me=S.me;me.streak=ok?me.streak+1:0;me.maxStreak=Math.max(me.maxStreak,me.streak);if(ok)me.correct++;
 var sc=scoreOf(ok,t,p.par,me.streak,S.hint);me.score+=sc.total;
 var shown=timeout?'（时间到）':skipped?'（跳过）':(p.choices?p.choices[S.choice]:S.input);
 me.res.push({ok:ok,t:t,input:shown,hint:S.hint,sc:sc});
 if(ok&&p.kind==='app'&&t<10)S.fast=true;
 var mi=S.mi;mi.streak=S.mOk?mi.streak+1:0;mi.maxStreak=Math.max(mi.maxStreak,mi.streak);if(S.mOk)mi.correct++;
 var msc=scoreOf(S.mOk,S.mt,p.par,mi.streak,false);mi.score+=msc.total;mi.res.push({ok:S.mOk,t:S.mt,sc:msc});
 var mb=$('#mBar');mb.style.transition='width .5s';mb.style.width='100%';$('#miuyaBox').classList.add('done');
 $('#mSay').textContent=ok&&S.mOk?pickOne(TXT.both):ok?pickOne(TXT.meOnly):S.mOk?pickOne(TXT.miOnly):pickOne(TXT.none);
 $('#timer').classList.remove('show');
 paintRace();
 if(ok){SFX.ok();if(me.streak>=3)toast('连对 '+me.streak+' 题，势不可挡！');}else SFX.no();
 showFeedback(ok,timeout,skipped,t,sc,msc);
}

function award(id,list){if(!store.badges[id]){store.badges[id]=Date.now();list.push(id);}}
function finish(){
 clearInterval(tickT);hideSheet();
 var me=S.me,mi=S.mi,res=me.score>mi.score?'win':me.score<mi.score?'lose':'tie',stars=me.correct>=9?3:me.correct>=6?2:1;
 var gained=Math.round(me.score/10)+(res==='win'?30:10)+stars*5,before=levelInfo(store.xp);
 store.xp+=gained;var after=levelInfo(store.xp);
 var st=store.stats;st.rounds++;if(res==='win'){st.wins++;if(S.topic!=='all')st.topicWins[S.topic]=(st.topicWins[S.topic]||0)+1;}
 st.correct+=me.correct;st.total+=10;
 var rec={date:Date.now(),d:S.d,topic:S.topic,score:me.score,mscore:mi.score,correct:me.correct,res:res,stars:stars};
 store.history.unshift(rec);store.history=store.history.slice(0,30);
 store.best.push(rec);store.best.sort(function(a,b){return b.score-a.score;});store.best=store.best.slice(0,10);
 var isBest=store.best[0]===rec&&store.best.length>1;
 var nb=[];award('first_round',nb);
 if(res==='win'){award('first_win',nb);if(S.d===2)award('win_mid',nb);if(S.d===3)award('win_hard',nb);if(S.topic!=='all')award('t_'+S.topic,nb);}
 if(me.correct===10)award('perfect',nb);if(me.maxStreak>=5)award('combo5',nb);if(me.maxStreak>=8)award('combo8',nb);if(S.fast)award('speed',nb);
 if(st.rounds>=10)award('rounds10',nb);if(st.wins>=5)award('wins5',nb);
 if(Object.keys(G.TOPICS).every(function(k){return st.topicWins[k];}))award('all_topics',nb);
 save();S.result={res:res,stars:stars,gained:gained,nb:nb,lvup:after.lv>before.lv?after:null,isBest:isBest};
 renderResult();show('result');
 if(res==='win'){SFX.win();confetti(70);}else SFX.lose();
 [0,1,2].forEach(function(i){setTimeout(function(){var s=$$('#resStars svg')[i];if(s&&i<stars){s.classList.add('lit');SFX.star(i);}},500+i*350);});
 if(nb.length)setTimeout(SFX.badge,1700);
}
function renderResult(){

 var title={win:'你赢啦！',lose:'只差一点点！',tie:'平局！'}[r.res];
 var say={win:'Miuya：心服口服～你太厉害啦！',lose:'Miuya：你进步好快！下一局你一定能赢我！',tie:'Miuya：我们旗鼓相当，再来一局定胜负！'}[r.res];
 var avgT=me.res.reduce(function(a,x){return a+x.t;},0)/me.res.length;avgT=avgT<10?Math.round(avgT*10)/10:Math.round(avgT);
 var starMsg=r.stars===3?'三颗星！超级棒！':r.stars===2?'两颗星！继续加油冲三星！':'完成挑战就有星星！多练练会更棒哦～';
 var h='<div class="res-grid"><div class="card">'+

 var t=T.think,d=T.daily,cats=TH.CAT_KEYS,tot=cats.reduce(function(a,k){return a+t.cat[k].n;},0);
 var h='<div class="pagehead"><button class="iconbtn" data-act="home" aria-label="返回">'+UI.IC.back+'</button><h2>思维能力</h2><span class="tag mint">家长看这里</span></div>';
 h+='<div class="card"><h3 style="margin-bottom:2px">解题四步，哪一步最需要练？</h3><div style="font-size:13px;color:var(--ink2)">按“第一次就想对、没看提示”的比例统计（共 '+t.done+' 道思路训练题）</div>';
 if(!tot)h+='<div class="empty">还没有数据。做几道思路训练题，这里就会画出图表～</div>';
 else{h+=cats.map(function(k){return abar(TH.CATS[k],t.cat[k].ok,t.cat[k].n,t.cat[k].n+' 次');}).join('');
  var weak=t.done<3?null:cats.filter(function(k){return t.cat[k].n>=3;}).sort(function(a,b){return t.cat[a].ok/t.cat[a].n-t.cat[b].ok/t.cat[b].n;})[0];
  if(weak&&t.cat[weak].ok/t.cat[weak].n<0.85)h+='<div class="atip"><b>建议多练「'+TH.CATS[weak]+'」：</b>'+TIPS[weak]+'</div>';
  else if(weak)h+='<div class="atip"><b>四步都掌握得不错！</b>可以把难度调高一级试试。</div>';
  else h+='<div class="atip">再多做几道题，图表会更准，也能看出哪一步最需要练。</div>';}
 h+='</div><div style="height:12px"></div>';
 var tps=Object.keys(TH.TOPICS).filter(function(k){return t.topic[k]&&t.topic[k].n;});
 h+='<div class="card"><h3 style="margin-bottom:2px">各类题目</h3>'+(tps.length?tps.map(function(k){return abar(TH.TOPICS[k],t.topic[k].ok,t.topic[k].n);}).join('')+'<div style="font-size:13px;color:var(--ink2)">“智能推荐”会自动多出百分比低的那类题。</div>':'<div class="empty">暂无数据</div>');
 if(t.recent.length){var rc=t.recent.slice(0,12).reverse();h+='<div style="font-weight:800;margin-top:12px">最近 '+rc.length+' 题（柱子越高，一次想对的步骤越多）</div><div class="spark">'+rc.map(function(r){return '<i title="'+r.ok+'/'+r.n+'" style="height:'+Math.max(8,Math.round(r.ok/r.n*100))+'%"></i>';}).join('')+'</div>';}
 h+='</div><div style="height:12px"></div>';
 var ty=d.types,tn=Object.keys(ty).reduce(function(a,k){return a+ty[k].n;},0);
 h+='<div class="card"><h3 style="margin-bottom:6px">每日逻辑小关卡</h3><div class="sumg" style="margin-bottom:6px"><div>连续打卡<b>'+shownStreak()+' 天</b></div><div>最长连续<b>'+d.best+' 天</b></div><div>完成天数<b>'+d.doneDays+'</b></div><div>当前难度<b>Lv.'+d.level+'</b></div></div>'+
  (tn?Object.keys(ty).map(function(k){return abar(LG.TYPE_NAME[k],ty[k].ok,ty[k].n,ty[k].n+' 题');}).join(''):'<div class="empty">还没有闯过关</div>')+'</div>';
 h+='<div class="res-actions"><button class="btn mint" data-act="think">去思路训练</button><button class="btn primary" data-act="daily">每日小关卡</button></div>';
 $('#abilityWrap').innerHTML=h;UI.show('ability');
}

/* ======================= 每日逻辑小关卡 ======================= */
var DS=null;
function shownStreak(){var d=T.daily,td=today();return d.lastDone&&(d.lastDone===td||d.lastDone===LG.addDays(td,-1))?d.streak:0;}
function dayRec(){var td=today(),d=T.daily;if(!d.days[td]){d.days[td]={level:d.level,idx:0,res:[],done:false};
  var ks=Object.keys(d.days).sort();while(ks.length>30){delete d.days[ks.shift()];}saveT();}return d.days[td];}
function openDaily(){
 var rec=dayRec();DS={date:today(),rec:rec,set:LG.daily(today(),rec.level),pz:null};
 if(rec.done)renderDailyDone(false);else startPuzzle();
}
function startPuzzle(){
 var p=DS.set.puzzles[DS.rec.idx];
 DS.pz={p:p,miss:0,hint:false,locked:false,sel:-1,grid:p.type==='sudoku'?p.puzzle.slice():null,checks:0,marks:{}};
 renderDaily();
}
function shapeSVG(tok,size){size=size||30;
 if(tok.indexOf('arrow:')===0){var a=+tok.split(':')[1];return '<svg viewBox="0 0 40 40" width="'+size+'" height="'+size+'"><g transform="rotate('+a+' 20 20)"><path d="M20 5L31 18H24V35H16V18H9Z" fill="#8e6bff" stroke="#5b3fd0" stroke-width="2" stroke-linejoin="round"/></g></svg>';}
 var p=tok.split(':'),c=p[1],s=p[0],body;
 if(s==='circle')body='<circle cx="20" cy="20" r="14"/>';else if(s==='square')body='<rect x="7" y="7" width="26" height="26" rx="3"/>';
 else if(s==='triangle')body='<path d="M20 5L35 33H5Z"/>';else if(s==='diamond')body='<path d="M20 4L35 20L20 36L5 20Z"/>';
 else if(s==='heart')body='<path d="M20 34S5 25 5 14a7.5 7.5 0 0 1 15-2 7.5 7.5 0 0 1 15 2c0 11-15 20-15 20z"/>';
 else body='<path d="M20 4l4.7 10 10.8 1.3-8 7.4 2.1 10.7L20 28l-9.6 5.4 2.1-10.7-8-7.4L15.3 14z"/>';
 return '<svg viewBox="0 0 40 40" width="'+size+'" height="'+size+'"><g fill="'+c+'" stroke="rgba(0,0,0,.18)" stroke-width="1.5" stroke-linejoin="round">'+body+'</g></svg>';
}
function dailyHead(){
 var res=DS.rec.res,idx=DS.rec.idx;
 return '<div class="pagehead"><button class="iconbtn" data-act="home" aria-label="返回">'+UI.IC.back+'</button><h2>每日逻辑小关卡</h2><span class="tag sun">'+(+DS.date.slice(5,7))+'月'+(+DS.date.slice(8))+'日</span></div>'+
  '<div class="d-strip"><span class="flame">'+IC2.flame+'连续打卡 '+shownStreak()+' 天</span><span class="tag">难度 Lv.'+DS.set.level+'</span><span class="d-dots">'+[0,1,2,3,4].map(function(i){var r=res[i];return '<i class="'+(r?(r.ok&&!r.hint?'ok':r.solved||r.ok?'ok':'no'):(i===idx&&!DS.rec.done?'cur':''))+'"></i>';}).join('')+'</span></div>';
}
function renderDaily(){
 var z=DS.pz,p=z.p,h=dailyHead();
 h+='<div class="d-grid"><div class="card"><div class="qtags"><span class="tag pink">第 '+p.no+' 关 · '+esc(p.typeName)+'</span><span class="tag">'+esc(p.title)+'</span><button class="hintbtn" data-act="d-hint" '+(z.hint||z.locked?'style="display:none"':'')+'>'+UI.IC.bulb+'提示</button></div>';
 if(p.intro)h+='<div class="d-intro">'+esc(p.intro)+'</div>';
 if(p.clues)h+='<ul class="d-clues">'+p.clues.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul>';
 if(p.cond)h+='<div class="d-cond">'+esc(p.cond)+'</div>';
 if(p.type==='pattern')h+='<div class="seqrow">'+p.seq.map(function(x){return '<span>'+(p.sub==='shape'?shapeSVG(x):esc(x))+'</span>';}).join('')+'<span class="q">?</span></div>';
 h+='<div class="d-prompt">'+esc(p.prompt)+'</div>';
 if(p.type==='reason'&&p.sub==='who'){h+='<div class="wgrid-cap">推理小表格（点一下画 ✗，再点画 ✓，再点清空）：</div><table class="wgrid"><tr><th></th>'+p.items.map(function(it){return '<th>'+esc(it)+'</th>';}).join('')+'</tr>'+
  p.people.map(function(pp,i){return '<tr><th>'+esc(pp)+'</th>'+p.items.map(function(_,j){var m=z.marks[i+'_'+j]||0;return '<td><button data-wg="'+i+'_'+j+'" class="'+(m===2?'yes':'')+'" aria-label="'+esc(pp)+'·'+esc(p.items[j])+'">'+(m===1?'✗':m===2?'✓':'')+'</button></td>';}).join('')+'</tr>';}).join('')+'</table>';}
 h+='</div><div class="card" id="dAnswer">';
 if(p.type==='sudoku')h+=sudokuHTML();
 else{var four=p.options.length===4&&(p.type==='pattern');
  h+='<div style="font-weight:800;margin-bottom:8px">选一选：</div><div class="d-opts'+(four?' four':'')+'">'+p.options.map(function(o,i){return '<button data-dopt="'+i+'">'+(p.type==='pattern'&&p.sub==='shape'?shapeSVG(o,34):esc(o))+'</button>';}).join('')+'</div>';}
 h+='<div class="hintbox'+(z.hint?' show':'')+'" id="dHint">'+(z.hintText?'<b>提示：</b>'+esc(z.hintText):'')+'</div><div class="t-fb" id="dFb"></div></div></div>';
 $('#dailyWrap').innerHTML=h;UI.show('daily');
}
function sudokuHTML(){
 var z=DS.pz,p=z.p,n=p.n,br=p.box[0],bc=p.box[1],h='<div class="sd" style="grid-template-columns:repeat('+n+',1fr)">';
 for(var i=0;i<n*n;i++){var r=Math.floor(i/n),c=i%n,given=p.puzzle[i]>0,cl=[];if(given)cl.push('given');if(z.sel===i)cl.push('sel');if(z.bad&&z.bad[i])cl.push('bad');if(z.hintCell===i)cl.push('hintc');
  if(c%bc===bc-1&&c<n-1)cl.push('br');if(r%br===br-1&&r<n-1)cl.push('bb');
  h+='<button data-sd="'+i+'" class="'+cl.join(' ')+'"'+(given?' aria-disabled="true"':'')+' aria-label="第'+(r+1)+'行第'+(c+1)+'格">'+(z.grid[i]||'')+'</button>';}
 h+='</div><div class="sd-pad" style="grid-template-columns:repeat('+n+',1fr) 1.4fr">';
 for(var v=1;v<=n;v++)h+='<button data-sdv="'+v+'">'+v+'</button>';
 h+='<button class="fn" data-sdv="0">擦掉</button></div><div class="d-actions">'+(z.checks>=2&&!z.locked?'<button class="btn ghost" data-act="d-reveal">看答案</button>':'')+'<button class="btn primary" data-act="d-check"'+(z.locked?' style="display:none"':'')+'>检查</button></div>';
 return h;
}
function dfb(cls,html){var el=$('#dFb');el.className='t-fb show '+cls;el.innerHTML=html;setTimeout(function(){var s=$('#dFb');if(s&&s.getBoundingClientRect().bottom>window.innerHeight)s.scrollIntoView({block:'nearest',behavior:'smooth'});},30);}
function explainHTML(p){return '<ol style="margin:6px 0 0;padding-left:20px">'+p.explain.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ol>';}
function puzzleDone(ok,solved,head,cls){
 var z=DS.pz,p=z.p;z.locked=true;
 DS.rec.res[DS.rec.idx]={ok:ok,hint:z.hint,solved:solved,type:p.type};
 var ty=T.daily.types[p.type];ty.n++;if(ok&&!z.hint)ty.ok++;
 if(p.type==='sudoku'&&p.n===6&&ok&&!z.hint){if(UI.award('sudoku6'))(DS.newBadges=DS.newBadges||[]).push('sudoku6');}
 saveT();
 var last=DS.rec.idx===4;
 dfb(cls,'<b class="h">'+head+'</b>'+explainHTML(p)+'<button class="btn '+(last?'purple':'mint')+'" data-act="d-next">'+(last?'完成今天的挑战':'下一关 →')+'</button>');
 var hb=$('[data-act="d-hint"]');if(hb)hb.style.display='none';
}
function chooseDaily(i){
 var z=DS.pz;if(!z||z.locked)return;var p=z.p,btn=$('[data-dopt="'+i+'"]');if(!btn||btn.disabled)return;
 if(i===p.answer){btn.classList.add('ok');$$('[data-dopt]').forEach(function(b){b.disabled=true;});UI.SFX.ok();puzzleDone(z.miss===0,true,pickOne(PRAISE),'good');return;}
 z.miss++;btn.classList.add('no');btn.disabled=true;UI.SFX.no();
 if(z.miss>=2){$('[data-dopt="'+p.answer+'"]').classList.add('ok');$$('[data-dopt]').forEach(function(b){b.disabled=true;});puzzleDone(false,false,'没关系，我们来看看怎么想：','show-ans');}
 else dfb('soft','<b class="h">'+pickOne(SOFT)+'</b>还有一次机会，再想想看。'+(z.hint?'':'可以点“提示”哦。'));
}
function dailyHint(){
 var z=DS.pz;if(!z||z.locked)return;z.hint=true;var p=z.p;
 if(p.type==='sudoku'){var hcell=LG.sdHint(z.grid.map(function(v,i){return z.bad&&z.bad[i]?0:v;}),p.n);
  if(hcell){var r=Math.floor(hcell.idx/p.n)+1,c=hcell.idx%p.n+1;z.grid[hcell.idx]=hcell.v;z.hintCell=hcell.idx;if(z.bad)z.bad[hcell.idx]=0;
   z.hintText='看第 '+r+' 行第 '+c+' 格：它所在的行、列和粗线框里，已经有了除 '+hcell.v+' 以外的数，所以只能填 '+hcell.v+'。我帮你填上啦，接着试试别的格子！';}
  else z.hintText=p.hint;}
 else z.hintText=p.hint;
 renderDaily();UI.SFX.tap();
}
function sdTap(i){var z=DS.pz;if(!z||z.locked||z.p.puzzle[i])return;z.sel=i;UI.SFX.tap();refreshSd();}
function sdVal(v){var z=DS.pz;if(!z||z.locked||z.sel<0||z.p.puzzle[z.sel])return;z.grid[z.sel]=v;if(z.bad)z.bad[z.sel]=0;if(z.hintCell===z.sel)z.hintCell=-1;UI.SFX.tap();
 // 自动跳到下一个空格
 var n=z.p.n;for(var k=1;k<=n*n;k++){var j=(z.sel+k)%(n*n);if(!z.grid[j]){z.sel=j;break;}}refreshSd();}
function refreshSd(){var box=$('#dAnswer'),keep=box.querySelectorAll('#dHint,#dFb');var hint=keep[0]?keep[0].outerHTML:'',f=keep[1]?keep[1].outerHTML:'';box.innerHTML=sudokuHTML()+hint+f;}
function sdCheck(){
 var z=DS.pz,p=z.p;if(!z||z.locked)return;
 if(z.grid.some(function(v){return !v;})){UI.toast('还有空格没填哦～');return;}
 var bad={},nb=0;z.grid.forEach(function(v,i){if(v!==p.solution[i]){bad[i]=1;nb++;}});
 if(!nb){z.bad=null;refreshSd();UI.SFX.ok();puzzleDone(z.checks===0,true,'全部填对啦！'+pickOne(PRAISE),'good');return;}
 z.checks++;z.bad=bad;UI.SFX.no();refreshSd();
 dfb('soft','<b class="h">'+pickOne(SOFT)+'</b>有 '+nb+' 个格子不太对（标成了红色），看看同一行、同一列和粗线框里有没有重复的数。'+(z.checks>=2?'实在想不出来，也可以点“看答案”。':''));
}
function sdReveal(){var z=DS.pz;if(!z||z.locked)return;z.grid=z.p.solution.slice();z.bad=null;refreshSd();puzzleDone(false,false,'没关系，看看完整的答案：','show-ans');}
function dailyNext(){
 DS.rec.idx++;saveT();
 if(DS.rec.idx>=5){completeDay();renderDailyDone(true);return;}
 startPuzzle();window.scrollTo(0,0);
}
function completeDay(){
 var d=T.daily,rec=DS.rec,td=DS.date;if(rec.done)return;rec.done=true;
 if(d.lastDone===LG.addDays(td,-1))d.streak++;else if(d.lastDone!==td)d.streak=1;
 d.lastDone=td;d.best=Math.max(d.best,d.streak);d.doneDays++;
 var before=d.level;d.level=LG.nextLevel(rec.level,rec.res);rec.lvChange=d.level-before;
 DS.newBadges=DS.newBadges||[];[['daily1',true],['streak3',d.streak>=3],['streak7',d.streak>=7]].forEach(function(b){if(b[1]&&UI.award(b[0]))DS.newBadges.push(b[0]);});
 saveT();UI.SFX.win();UI.confetti(60);if(DS.newBadges.length)setTimeout(UI.SFX.badge,900);
}
function renderDailyDone(fresh){
 var rec=DS.rec,good=rec.res.filter(function(r){return r&&r.ok&&!r.hint;}).length,solved=rec.res.filter(function(r){return r&&(r.ok||r.solved);}).length;
 var lv=rec.lvChange>0?'明天的题会难一点点，你准备好啦！':rec.lvChange<0?'明天的题会简单一点，慢慢来～':'明天继续保持这个难度。';
 var h=dailyHead()+'<div class="card" style="text-align:center"><div class="trophy">'+UI.IC.trophy+'</div><h2 style="font-size:26px;margin-top:4px">今天的 5 关全部完成！</h2>'+
  '<p style="color:var(--ink2);margin:6px 0">'+(good===5?'5 关全部独立答对，逻辑小达人就是你！':'独立答对 '+good+' 关'+(solved>good?'，另外 '+(solved-good)+' 关多想了一想，也闯过去了':'')+'。每天练一练，脑子会越来越灵活！')+'</p>'+
  '<div class="stars" id="dStars">'+[0,1,2,3,4].map(function(i){return '<span style="display:inline-block">'+UI.IC.star.replace('<svg','<svg class="'+(i<good?'lit':'')+'" style="width:40px;height:40px"')+'</span>';}).join('')+'</div>'+
  '<div class="sumg" style="margin:12px 0"><div>连续打卡<b>'+shownStreak()+' 天</b></div><div>最长连续<b>'+T.daily.best+' 天</b></div><div>独立答对<b>'+good+'/5</b></div><div>明天难度<b>Lv.'+T.daily.level+'</b></div></div>'+
  '<div class="atip" style="text-align:left">'+esc(lv)+' 明天再来，连续打卡天数会继续增加哦。</div>'+
  (DS.newBadges&&DS.newBadges.length&&fresh?'<div class="sec-title" style="justify-content:center">获得新徽章</div><div class="newbadges">'+DS.newBadges.map(function(id){var b=UI.badgeById(id);return '<div class="mini-badge">'+UI.badgeSVG(b)+b[2]+'</div>';}).join('')+'</div>':'')+
  '<div class="res-actions"><button class="btn mint" data-act="think">去思路训练</button><button class="btn ghost" data-act="ability">思维能力</button><button class="btn ghost wide" data-act="home">回首页</button></div></div>';
 $('#dailyWrap').innerHTML=h;UI.show('daily');
}

/* ======================= 首页入口 ======================= */
function onHome(){
 var a=$('#icThink'),b=$('#icDaily');if(a)a.innerHTML=IC2.think;if(b)b.innerHTML=IC2.daily;
 var ab=$('[data-act="ability"]');if(ab&&ab.closest('.home-links'))ab.innerHTML=IC2.brain+'思维能力';
 var rec=T.daily.days[today()],sub=$('#dailySub');
 if(sub)sub.textContent=(rec&&rec.done?'今天已完成 ✓':'今天 '+(rec?rec.idx:0)+'/5')+' · 连续打卡 '+shownStreak()+' 天';
}
window.MathPKExt={onHome:onHome};
onHome();

/* ======================= 事件 ======================= */
document.addEventListener('click',function(e){
 var t=e.target.closest('button');if(!t)return;
 if(t.dataset.tk){tPress(t.dataset.tk);return;}
 if(t.dataset.topt!==undefined){chooseOpt(+t.dataset.topt);return;}
 if(t.dataset.ttopic){T.think.sel=t.dataset.ttopic;saveT();UI.SFX.tap();$$('[data-ttopic]').forEach(function(b){b.classList.toggle('on',b===t);});return;}
 if(t.dataset.tlv){T.think.level=+t.dataset.tlv;saveT();UI.SFX.tap();$$('[data-tlv]').forEach(function(b){b.classList.toggle('on',b===t);});return;}
 if(t.dataset.dopt!==undefined){chooseDaily(+t.dataset.dopt);return;}
 if(t.dataset.wg){var z=DS&&DS.pz;if(!z)return;var m=((z.marks[t.dataset.wg]||0)+1)%3;z.marks[t.dataset.wg]=m;t.textContent=m===1?'✗':m===2?'✓':'';t.classList.toggle('yes',m===2);UI.SFX.tap();return;}
 if(t.dataset.sd!==undefined){sdTap(+t.dataset.sd);return;}
 if(t.dataset.sdv!==undefined){sdVal(+t.dataset.sdv);return;}
 switch(t.dataset.act){
  case 'think':UI.SFX.tap();thinkStart();break;
  case 't-go':UI.SFX.tap();TS=null;newThinkProblem();break;
  case 't-again':UI.SFX.tap();newThinkProblem();window.scrollTo(0,0);break;
  case 't-back':UI.SFX.tap();thinkStart();break;
  case 't-hint':if(!TS||TS.locked)return;TS.hint=true;$('#tHint').classList.add('show');t.style.display='none';UI.SFX.tap();break;
  case 't-submit':submitCalc();break;
  case 't-next':UI.SFX.tap();thinkNext();break;
  case 'ability':UI.SFX.tap();renderAbility();break;
  case 'daily':UI.SFX.tap();openDaily();break;
  case 'd-hint':dailyHint();break;
  case 'd-check':sdCheck();break;
  case 'd-reveal':sdReveal();break;
  case 'd-next':UI.SFX.tap();dailyNext();break;
 }
});
document.addEventListener('keydown',function(e){
 if($('#modal').classList.contains('show'))return;
 if($('#scr-think').classList.contains('active')&&TS&&TS.prob.steps[TS.si]){
  var st=TS.prob.steps[TS.si];
  if(TS.locked){if(e.key==='Enter'){e.preventDefault();thinkNext();}return;}
  if(st.opts){var n=parseInt(e.key,10);if(n>=1&&n<=st.opts.length)chooseOpt(n-1);return;}
  if(/^\d$/.test(e.key))tPress(e.key);else if(e.key==='.')tPress('.');else if(e.key==='Backspace')tPress('del');else if(e.key==='Enter'){e.preventDefault();submitCalc();}
 }
});
MP.think={get state(){return TS;},get store(){return T;},get daily(){return DS;},render:renderTFig,reset:function(){T=defT();saveT();onHome();}};
})();
</script>
